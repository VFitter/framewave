<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Framewave — audio-visualizer</title>
  <style>
    body { background: #0a0a0f; margin: 0; display: grid; place-items: center; min-height: 100vh; font-family: system-ui, sans-serif; }
    canvas { max-width: 92vw; height: auto; border-radius: 12px; box-shadow: 0 20px 80px rgba(0,0,0,.6); }
    .bar { position: fixed; bottom: 16px; display: flex; gap: 10px; }
    button { background: #1c1c28; color: #eee; border: 1px solid #333; border-radius: 8px; padding: 8px 18px; cursor: pointer; font-size: 14px; }
    button:hover { background: #2a2a3a; }
  </style>
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>
  <div class="bar">
    <button id="playpause">Pause</button>
    <button id="export">Export MP4</button>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
